name: Huffman Protocol cross-project integration

on:
  pull_request:
    paths:
      - "integration_tests/**"
      - "docs/HUFFMAN-PROTOCOL-INTEGRATION.md"
      - ".github/workflows/huffman-protocol-integration.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "integration_tests/**"
      - "docs/HUFFMAN-PROTOCOL-INTEGRATION.md"
      - ".github/workflows/huffman-protocol-integration.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-project:
    runs-on: ubuntu-latest
    env:
      HUFFMAN_OIX_SHA: 19f525e5e3bcff96b2f4d3137cf210e022682a6e
      HUFFMAN_HDI_SHA: af4ed25c44eac7af9d71cdac27f6747a0dcbe05a
      HUFFMAN_RECEIPT_DIR: .artifacts/huffman-assurance
    steps:
      - name: Check out Open-Swarm
        uses: actions/checkout@v4

      - name: Check out pinned OIX dependency
        uses: actions/checkout@v4
        with:
          repository: HuffmanMainNode/Open-Intelligence-Exchange
          ref: 19f525e5e3bcff96b2f4d3137cf210e022682a6e
          path: deps/oix

      - name: Check out pinned HDI dependency
        uses: actions/checkout@v4
        with:
          repository: HuffmanMainNode/Huffman-Defensive-Intelligence
          ref: af4ed25c44eac7af9d71cdac27f6747a0dcbe05a
          path: deps/hdi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned cross-project packages
        run: python -m pip install -e ./deps/oix -e ./deps/hdi -e ".[dev]"

      - name: Run real OIX to Open-Swarm lifecycle scenarios
        run: python -m pytest -q integration_tests

      - name: Lint integration and runtime code
        run: ruff check src integration_tests

      - name: Security lint
        run: bandit -q -r src

      - name: Upload signed assurance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huffman-protocol-assurance-receipts
          path: .artifacts/huffman-assurance/*.json
          if-no-files-found: warn
