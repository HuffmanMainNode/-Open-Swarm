name: OIX interoperability

on:
  push:
    branches:
      - integration/phase-2-oix-atomic-handoff
  pull_request:
    branches:
      - integration/phase-1-supervised-outbox-relay
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-oix-swarm-exchange:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Open-Swarm
        uses: actions/checkout@v4
      - name: Check out OIX Phase 2
        uses: actions/checkout@v4
        with:
          repository: HuffmanMainNode/Open-Intelligence-Exchange
          ref: integration/phase-2-transactional-inbox
          path: Open-Intelligence-Exchange
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OIX and Open-Swarm
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./Open-Intelligence-Exchange
          python -m pip install -e ".[dev]"
      - name: Run real OIX-to-Open-Swarm exchange
        run: python examples/oix_handoff_demo.py
