name: OIX interoperability

on:
  push:
    branches:
      - integration/phase-2-oix-atomic-handoff
      - integration/phase-3-oix-result-outbox
      - integration/phase-4-oix-secure-result-integration
      - integration/phase-5-oix-authenticated-receipts
      - integration/phase-6-oix-one-time-prekey-exchange
      - integration/phase-7-oix-mutual-tls-e2e
      - integration/phase-8-oix-agent-bound-mtls
      - integration/phase-9-oix-persistent-streams
      - integration/phase-10-oix-evidence-event-ingestion
      - integration/phase-11-osint-evidence-sources
      - integration/phase-12-continuous-ingestion-supervisor
  pull_request:
    branches:
      - integration/phase-1-supervised-outbox-relay
      - integration/phase-2-oix-atomic-handoff
      - integration/phase-3-oix-result-outbox
      - integration/phase-4-oix-secure-result-integration
      - integration/phase-5-oix-authenticated-receipts
      - integration/phase-6-oix-one-time-prekey-exchange
      - integration/phase-7-oix-mutual-tls-e2e
      - integration/phase-8-oix-agent-bound-mtls
      - integration/phase-9-oix-persistent-streams
      - integration/phase-10-oix-evidence-event-ingestion
      - integration/phase-11-osint-evidence-sources
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-oix-swarm-exchange:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Open-Swarm
        uses: actions/checkout@v4
      - name: Check out OIX Phase 11
        uses: actions/checkout@v4
        with:
          repository: HuffmanMainNode/Open-Intelligence-Exchange
          ref: integration/phase-11-evidence-submit-contract
          path: Open-Intelligence-Exchange
      - name: Check out Halloween OSINT evidence bridge
        uses: actions/checkout@v4
        with:
          repository: HuffmanMainNode/Halloween-OSINT-2026
          ref: integration/oix-evidence-bridge
          path: Halloween-OSINT-2026
      - name: Check out Huffman Cyber Observatory evidence bridge
        uses: actions/checkout@v4
        with:
          repository: HuffmanMainNode/Huffman-Cyber-Observatory
          ref: integration/oix-evidence-bridge
          path: Huffman-Cyber-Observatory
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install all four ecosystem repositories
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./Open-Intelligence-Exchange
          python -m pip install -e ./Halloween-OSINT-2026
          python -m pip install -e ./Huffman-Cyber-Observatory
          python -m pip install -e ".[dev]"
      - name: Run OIX evidence ingestion regression tests
        run: pytest tests/test_oix_evidence.py
      - name: Run CISA KEV source adapter tests
        run: pytest tests/test_cisa_kev_source.py tests/test_ingest_cli.py
      - name: Run continuous ingestion demonstration
        run: python examples/cisa_kev_ingestion_demo.py
      - name: Run real OIX-to-Open-Swarm request handoff
        run: python examples/oix_handoff_demo.py
      - name: Run signed OIX result return demonstration
        run: python examples/oix_result_demo.py
      - name: Run encrypted OIX request and result round trip
        run: python examples/oix_secure_result_demo.py
      - name: Run mutual-TLS cross-agent request and result exchange
        run: python examples/oix_mutual_tls_e2e_demo.py
      - name: Run four-repository OSINT evidence ecosystem exchange
        run: python examples/osint_ecosystem_e2e_demo.py
